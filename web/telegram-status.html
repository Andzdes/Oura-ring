<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Статус Oura</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- region layout -->
<style>
body{font:16px system-ui;margin:0;padding:24px 18px;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#222)}main{max-width:480px;margin:auto}h1{font-size:26px}p{line-height:1.5}button{font:inherit;padding:14px;border:0;border-radius:12px;width:100%;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}button:disabled{opacity:.5}.hint{color:var(--tg-theme-hint-color,#68727e)}
</style>
<main>
<h1>Connect</h1>
<p>Разреши боту менять твой эмодзи-статус.</p>
<button id="allow" disabled>Разрешить смену статуса</button>
<button id="return" hidden>Вернуться в чат</button>
<p id="result" role="status" aria-live="polite"></p>
</main>
<!-- endregion layout -->
<script>
const app=window.Telegram?.WebApp;
const el=id=>document.getElementById(id);
const result=el('result');
// #region permission-flow
if(!app?.initData){result.textContent='Открой эту страницу кнопкой в @andrey_service_bot внутри Telegram.';}
else if(!app.isVersionAtLeast('8.0')){result.textContent='Обнови Telegram: требуется поддержка Mini Apps 8.0.';}
else{
  app.ready();app.expand();
  el('return').onclick=()=>app.close();
  const checkAccess=(requestedByClick=false)=>{
    el('allow').disabled=true;
    el('allow').textContent='Проверяю разрешение…';
    try{
      app.requestEmojiStatusAccess(async granted=>{
        el('allow').disabled=granted;
        el('allow').textContent=granted?'Смена статуса разрешена':'Разрешить смену статуса';
        if(!granted)result.textContent='Разрешение не получено. Можно попробовать снова.';
        if(granted){
          try{
            const response=await fetch('/oura-status/api/access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:app.initData})});
            if(!response.ok)throw new Error('save');
            if(requestedByClick){app.close();}
            else{
              result.textContent='Разрешение уже выдано. Настройки доступны в чате.';
              el('return').hidden=false;
            }
          }catch{result.textContent='Разрешение получено. Вернись в чат: /sleep и /awake.';}
        }
      });
    }catch{
      el('allow').disabled=false;
      el('allow').textContent='Разрешить смену статуса';
      result.textContent='Не удалось проверить разрешение. Нажми кнопку ещё раз.';
    }
  };
  el('allow').onclick=()=>checkAccess(true);
  checkAccess();
}

// #endregion permission-flow
</script>
</html>
